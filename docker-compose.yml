services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  docling:
    image: ghcr.io/docling-project/docling-serve
    profiles: ["docling"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
    ports:
      - "5001:5001"

volumes:
  pgvector-data:
