<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Knowledge Studio pipeline overview</title>
  <desc id="description">A local workbench with configuration, source trace, chunk output, and retrieval stages.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#102421"/>
      <stop offset="1" stop-color="#183d36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17322c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#f4f7f5"/>
  <rect width="1200" height="70" rx="18" fill="url(#header)"/>
  <rect y="52" width="1200" height="18" fill="url(#header)"/>
  <rect x="22" y="17" width="36" height="36" rx="10" fill="#a5e5d2"/>
  <text x="40" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#102421">K</text>
  <text x="72" y="33" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7fffc">Knowledge Studio</text>
  <text x="72" y="49" font-family="Arial, sans-serif" font-size="9" fill="#9fb8b2">local-first RAG workbench</text>
  <rect x="506" y="18" width="188" height="34" rx="9" fill="#1d3934" stroke="#41615b"/>
  <rect x="510" y="22" width="91" height="26" rx="6" fill="#d7f1e7"/>
  <text x="555" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17312b">Pipeline</text>
  <text x="647" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a8bdb8">Retrieval Lab</text>

  <rect x="0" y="70" width="300" height="550" fill="#edf3ef"/>
  <line x1="300" y1="70" x2="300" y2="620" stroke="#d6e0dc"/>
  <text x="24" y="105" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4" fill="#0f806c">PIPELINE CONFIGURATION</text>
  <text x="24" y="129" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172321">Inspect every boundary</text>
  <g font-family="Arial, sans-serif">
    <rect x="22" y="154" width="256" height="112" rx="11" fill="#fff" stroke="#d7e0dc"/>
    <text x="37" y="178" font-size="11" font-weight="700" fill="#33443f">Input</text>
    <rect x="37" y="191" width="226" height="29" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
    <text x="48" y="210" font-size="10" fill="#66736f">product-handbook.md</text>
    <rect x="37" y="229" width="142" height="25" rx="6" fill="#eff7f4" stroke="#a8c9c0" stroke-dasharray="3 3"/>
    <text x="108" y="245" text-anchor="middle" font-size="9" fill="#49615a">Upload document</text>

    <rect x="22" y="278" width="256" height="104" rx="11" fill="#fff" stroke="#d7e0dc"/>
    <text x="37" y="302" font-size="11" font-weight="700" fill="#33443f">Extraction</text>
    <rect x="37" y="315" width="226" height="31" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
    <text x="48" y="335" font-size="10" fill="#66736f">Direct · no extraction</text>
    <text x="37" y="366" font-size="9" fill="#83908c">Switch to Docling for PDF and Office files.</text>

    <rect x="22" y="394" width="256" height="142" rx="11" fill="#fff" stroke="#d7e0dc"/>
    <text x="37" y="418" font-size="11" font-weight="700" fill="#33443f">Read &amp; chunk</text>
    <rect x="37" y="431" width="105" height="31" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
    <rect x="154" y="431" width="109" height="31" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
    <text x="49" y="451" font-size="10" fill="#66736f">Auto detect</text>
    <text x="166" y="451" font-size="10" fill="#66736f">Markdown</text>
    <text x="37" y="483" font-size="9" fill="#75837f">Chunk size</text>
    <text x="154" y="483" font-size="9" fill="#75837f">Overlap</text>
    <rect x="37" y="491" width="105" height="30" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
    <rect x="154" y="491" width="109" height="30" rx="6" fill="#f8faf9" stroke="#cad5d0"/>
