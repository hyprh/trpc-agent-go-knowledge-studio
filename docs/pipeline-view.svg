    <rect x="826" y="253" width="22" height="22" rx="5" fill="#dff2eb"/>
    <text x="837" y="268" text-anchor="middle" font-family="monospace" font-size="8" fill="#0a6657">02</text>
    <text x="856" y="268" font-family="monospace" font-size="8" fill="#76847f">preview-…-chunk-2</text>
    <text x="1147" y="268" text-anchor="end" font-family="monospace" font-size="8" fill="#76847f">486r · mapped</text>
    <text x="826" y="294" font-family="monospace" font-size="8.5" fill="#35443f">## Persistent storage</text>
    <text x="826" y="311" font-family="monospace" font-size="8.5" fill="#35443f">PGVector is the recommended persistent…</text>

    <rect x="812" y="353" width="350" height="93" rx="8" fill="#fff" stroke="#dce3df"/>
    <rect x="812" y="353" width="4" height="93" rx="2" fill="#95bfb4"/>
    <rect x="826" y="364" width="22" height="22" rx="5" fill="#dff2eb"/>
    <text x="837" y="379" text-anchor="middle" font-family="monospace" font-size="8" fill="#0a6657">03</text>
    <text x="856" y="379" font-family="monospace" font-size="8" fill="#76847f">preview-…-chunk-3</text>
    <text x="826" y="407" font-family="monospace" font-size="8.5" fill="#35443f">## Boundary cases</text>
    <text x="826" y="424" font-family="monospace" font-size="8.5" fill="#35443f">Version tokens remain on natural boundaries…</text>

    <rect x="812" y="464" width="350" height="93" rx="8" fill="#fff" stroke="#dce3df"/>
    <rect x="812" y="464" width="4" height="93" rx="2" fill="#95bfb4"/>
    <rect x="826" y="475" width="22" height="22" rx="5" fill="#dff2eb"/>
    <text x="837" y="490" text-anchor="middle" font-family="monospace" font-size="8" fill="#0a6657">04</text>
    <rect x="826" y="512" width="92" height="13" rx="2" fill="#ffd8c9"/>
    <text x="826" y="522" font-family="monospace" font-size="8.5" fill="#35443f">overlap prefix</text>
    <text x="923" y="522" font-family="monospace" font-size="8.5" fill="#35443f">then the next core…</text>
