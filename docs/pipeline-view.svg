  <text x="337" y="207" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172321">product-handbook.md</text>
  <text x="811" y="185" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="#0f806c">CHUNK OUTPUT</text>
  <text x="811" y="207" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172321">6 chunks · Markdown</text>

  <g font-family="monospace" font-size="8.6" fill="#384743">
    <text x="338" y="251"># Product knowledge handbook</text>
    <text x="338" y="270">This sample exercises headings, long prose,</text>
    <text x="338" y="289">tables, code blocks, and multilingual text.</text>
    <rect x="334" y="302" width="340" height="72" rx="5" fill="#dff2eb"/>
    <text x="338" y="321">## Persistent storage</text>
    <text x="338" y="340">PGVector is the recommended persistent store.</text>
    <text x="338" y="359">It supports vector, keyword, hybrid, and filter.</text>
    <text x="338" y="397">## Boundary cases</text>
    <text x="338" y="416">Version tokens: 12.6, 2.8.12, and v1.2.3.</text>
    <rect x="334" y="430" width="316" height="18" rx="3" fill="#ffd8c9"/>
    <text x="338" y="443">Mixed punctuation: ？！ 中文 and English.</text>
  </g>

  <g>
    <path d="M 674 322 C 730 322, 755 268, 812 268" fill="none" stroke="#e86f42" stroke-width="2"/>
    <path d="M 674 401 C 730 401, 755 384, 812 384" fill="none" stroke="#9dbdb4" stroke-width="1.4"/>
    <path d="M 674 439 C 730 439, 755 499, 812 499" fill="none" stroke="#9dbdb4" stroke-width="1.4"/>
  </g>

