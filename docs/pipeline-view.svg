  <text x="257" y="583" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#fff">→</text>

  <rect x="320" y="91" width="860" height="55" rx="10" fill="#fff" stroke="#dce3df"/>
  <g font-family="Arial, sans-serif">
    <text x="339" y="111" font-size="8" font-weight="700" letter-spacing="1" fill="#83908c">INPUT</text>
    <text x="339" y="130" font-family="monospace" font-size="13" fill="#172321">1,842 runes</text>
    <text x="510" y="111" font-size="8" font-weight="700" letter-spacing="1" fill="#83908c">OUTPUT</text>
    <text x="510" y="130" font-family="monospace" font-size="13" fill="#172321">6 chunks</text>
    <text x="674" y="111" font-size="8" font-weight="700" letter-spacing="1" fill="#83908c">AVERAGE</text>
    <text x="674" y="130" font-family="monospace" font-size="13" fill="#172321">307.0</text>
    <text x="838" y="111" font-size="8" font-weight="700" letter-spacing="1" fill="#83908c">BUDGET</text>
    <text x="838" y="130" font-family="monospace" font-size="13" fill="#0f806c">OK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="164" width="386" height="430" rx="13" fill="#fff" stroke="#cbd6d1"/>
    <rect x="794" y="164" width="386" height="430" rx="13" fill="#fff" stroke="#cbd6d1"/>
  </g>
  <line x1="320" y1="222" x2="706" y2="222" stroke="#dce3df"/>
