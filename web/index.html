<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Workbench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="5.2" stroke="var(--cyan)" stroke-width="1.4"/>
        <circle cx="11.4" cy="9" r="5.2" stroke="var(--magenta)" stroke-width="1.4" opacity=".75"/>
        <path d="M9 0v3.2M9 14.8V18M0 9h3.2M14.8 9H18" stroke="var(--text)" stroke-width="1.2"/>
      </svg>
      <span class="brand-name">Knowledge Workbench</span>
    </div>

    <div class="kb-wrap" id="kbWrap" hidden>
      <button class="kb-switch" id="kbSwitch" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="dot" id="kbDot"></span><b id="kbName"></b><span class="caret">▼</span>
      </button>
      <div class="pop" id="kbPop" role="menu"></div>
    </div>

    <div class="readout">
      <div class="ro"><span class="lbl">store</span><span class="ro-v" id="roStore">—</span></div>
      <div class="ro"><span class="lbl">embed</span><span class="ro-v" id="roEmbed">—</span></div>
      <div class="ro"><span class="lbl">stream</span><span class="ro-v"><span class="dot" id="roSSE"></span></span></div>
    </div>

    <button class="icon-btn" id="themeBtn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="3.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7 .6v1.8M7 11.6v1.8M.6 7h1.8M11.6 7h1.8M2.5 2.5l1.3 1.3M10.2 10.2l1.3 1.3M11.5 2.5l-1.3 1.3M3.8 10.2l-1.3 1.3"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div class="mid">
    <nav class="rail">
      <div class="rail-sec lbl">Workspace</div>
      <div class="rail-grp">
        <button class="nav on" data-plate="bases" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="1.2" y="1.2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="7.8" y="1.2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1.2" y="7.8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="7.8" y="7.8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          <span class="t">Knowledge bases</span><span class="cnt" id="navBaseCount"></span>
        </button>
      </div>

      <div class="rail-sec lbl" id="railBase">点右侧卡片选择知识库</div>
      <div class="rail-grp">
        <button class="nav scoped" data-plate="settings" type="button" disabled
                title="先选择一个知识库">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="2.1" stroke="currentColor" stroke-width="1.3"/><path d="M7 1.2v1.6M7 11.2v1.6M1.2 7h1.6M11.2 7h1.6M2.9 2.9l1.1 1.1M10 10l1.1 1.1M11.1 2.9 10 4M4 10l-1.1 1.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span class="t">Overview &amp; settings</span>
        </button>
        <button class="nav scoped" data-plate="sources" type="button" disabled
                title="先选择一个知识库">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1.6 3.4v7.2c0 .6.5 1 1 1h8.8c.6 0 1-.4 1-1V4.8c0-.5-.4-1-1-1H7.2L5.9 2.4H2.6c-.5 0-1 .5-1 1Z" stroke="currentColor" stroke-width="1.3"/></svg>
          <span class="t">Sources</span><span class="cnt" id="navSrcCount"></span>
        </button>
        <button class="nav scoped" data-plate="chunks" type="button" disabled
                title="先选择一个知识库">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="1.4" y="1.6" width="11.2" height="3.4" rx=".8" stroke="currentColor" stroke-width="1.3"/><rect x="1.4" y="6.2" width="11.2" height="3.4" rx=".8" stroke="currentColor" stroke-width="1.3"/><path d="M1.4 11.6h7.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="t">Chunk inspector</span>
        </button>
        <button class="nav scoped" data-plate="retrieval" type="button" disabled
                title="先选择一个知识库">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="6.2" cy="6.2" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="m9.4 9.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="t">Retrieval</span>
        </button>
        <button class="nav" type="button" disabled title="v1">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="3.4" r="1.9" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="4.6" r="1.7" stroke="currentColor" stroke-width="1.3"/><circle cx="6.4" cy="11" r="1.9" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 4.6 5.4 9.2M4.8 3.7l4.5.7M9.9 6.1 7.6 9.5" stroke="currentColor" stroke-width="1.2"/></svg>
          <span class="t">Graph explorer</span><span class="cnt">v1</span>
        </button>
      </div>
    </nav>

    <main class="stage">
      <!-- Bases -->
      <section class="plate on" id="plate-bases">
        <div class="phead">
          <h2>Knowledge bases</h2>
          <span class="sub" id="basesSub"></span>
          <span class="spacer"></span>
          <button class="btn pri" id="newBaseBtn" type="button">+ New base</button>
        </div>
        <div class="scroll"><div id="basesBody"></div></div>
      </section>

      <!-- Settings -->
      <section class="plate" id="plate-settings">
        <div class="phead">
          <h2 id="setTitle"></h2>
          <span class="sub mono" id="setId" style="font-size:11px"></span>
          <span class="spacer"></span>
          <button class="btn" data-plate="sources" type="button">Sources →</button>
          <button class="btn pri" id="saveBaseBtn" type="button">Save changes</button>
        </div>
        <div class="ov-strip" id="setOverview"></div>
        <div class="set-body" id="setBody"></div>
      </section>

      <!-- Sources -->
      <section class="plate" id="plate-sources">
        <div class="phead">
          <h2>Sources</h2>
          <span class="sub" id="srcSub"></span>
          <span class="spacer"></span>
          <button class="btn" id="syncAllBtn" type="button">⟳ Sync all</button>
          <button class="btn pri" id="addSrcBtn" type="button">+ Add source</button>
        </div>
        <div class="split">
          <div class="main-col">
            <div class="scroll"><div id="srcBody"></div></div>
          </div>
          <div class="gutter" id="srcGutter" role="separator" aria-orientation="vertical"
               tabindex="0" aria-label="调整详情栏宽度"></div>
          <aside class="side" id="srcSide"></aside>
        </div>
      </section>

      <!-- Chunk inspector -->
      <section class="plate" id="plate-chunks">
        <div class="phead">
          <h2>Chunk inspector</h2>
          <span class="sub" id="ciCrumb">选择左侧文件</span>
          <span class="spacer"></span>
          <button class="btn" id="ciApplyBtn" type="button" disabled>把这套参数写入 source</button>
        </div>
        <div class="ci-bar">
          <div class="fld"><span class="lbl">strategy</span>
            <select class="inp" id="ciStrategy">
              <option value="">default（跟随 reader）</option>
              <option value="recursive">recursive</option>
              <option value="fixed">fixed</option>
              <option value="markdown">markdown</option>
              <option value="json">json</option>
            </select></div>
          <div class="fld"><span class="lbl">reader</span>
            <select class="inp" id="ciReader">
              <option value="">auto</option><option value="text">text</option>
              <option value="markdown">markdown</option><option value="json">json</option>
              <option value="csv">csv</option><option value="go">go</option>
              <option value="proto">proto</option><option value="pdf">pdf</option>
              <option value="docx">docx</option>
            </select></div>
          <div class="fld"><span class="lbl">chunk size</span>
            <input class="rng" type="range" id="ciSize" min="64" max="4096" step="32" value="1024" aria-label="chunk size">
            <span class="rngv" id="ciSizeV">1024</span></div>
          <div class="fld"><span class="lbl">overlap</span>
            <input class="rng" type="range" id="ciOv" min="0" max="1024" step="8" value="0" aria-label="overlap">
            <span class="rngv" id="ciOvV">0</span></div>
          <span class="spacer"></span>
          <div class="legend">
            <span class="lg"><i style="background:var(--cyan-soft)"></i>选中块</span>
            <span class="lg"><i style="background:var(--overprint-soft)"></i>overlap</span>
          </div>
          <span class="chip" id="ciUnit">unit: runes</span>
        </div>
        <div id="ciBanner"></div>
        <div class="ov-strip" id="ciMetrics"></div>
        <div class="ci-view">
          <svg id="ciConn" aria-hidden="true"></svg>
          <aside class="ci-tree">
            <div class="tree-bar">
              <input class="inp" type="search" id="ciFilter" placeholder="Filter files…" style="width:100%" aria-label="filter files">
            </div>
            <div class="tree-scroll" id="ciTree"></div>
          </aside>
          <div class="gutter" id="ciGutter" role="separator" aria-orientation="vertical"
               tabindex="0" aria-label="调整文件树宽度"></div>
          <div class="ci-pane">
            <div class="pane-head"><h3>Source</h3><span class="chip" id="ciSrcMeta">—</span>
              <span class="spacer"></span>
              <div class="view-toggle" id="ciView" hidden>
                <button type="button" data-view="rendered">渲染</button>
                <button type="button" data-view="raw">原文</button>
              </div></div>
            <div class="doc" id="ciDoc"></div>
          </div>
          <div class="ci-pane">
            <div class="pane-head"><h3>Chunks</h3><span class="spacer"></span>
              <span class="lbl" id="ciNote"></span></div>
            <div class="chunks" id="ciChunks"></div>
          </div>
        </div>
      </section>

      <!-- Retrieval -->
      <section class="plate" id="plate-retrieval">
        <div class="phead">
          <h2>Retrieval</h2>
          <span class="sub" id="rtSub"></span>
        </div>
        <div class="rt-bar">
          <div class="q-row">
            <input class="inp" id="rtQuery" placeholder="提问，例如：chunk size 的单位是什么"
                   style="flex:1;height:32px" aria-label="query">
            <button class="btn pri" id="rtGo" type="button">Search</button>
          </div>
          <div class="f-row">
            <span class="lbl">mode</span>
            <div class="seg" id="rtModes"></div>
            <span class="lbl">top-k</span>
            <input class="inp num" id="rtTopK" value="5" style="width:56px" aria-label="top k">
            <span class="lbl">min score</span>
            <input class="inp num" id="rtMinScore" value="0" step="0.05" min="0" max="1"
                   style="width:66px" aria-label="min score">
            <span class="spacer"></span>
            <button class="btn gho" id="rtAddFilter" type="button">+ metadata 过滤</button>
          </div>
          <div id="rtFilters"></div>
          <div id="rtNotes"></div>
        </div>
        <div class="hits" id="rtBody"></div>
      </section>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
